# Paths are relative to this file. The supplied ledger contains example values.
input:
  path: docs/jmh_sample.csv
  delimiter: auto  # auto, ',' or "\t"
output:
  directory: out
  formats: [png]  # png, pdf, svg; CSV summaries are always written
# Both benchmarks are present in the synthetic test ledger.
benchmarks: [mb1_rawNoFinalize, mb2_rawFinalize]
strategies:
  labels:
    base: Base
    1a: S1_A
    1b: S1_B
    1c: S1_C
    2null: S2_0
    2a: S2_A
    2b: S2_B
    '3': S3
    '4': S4
  order: [base, 1a, 1b, 1c, 2null, 2a, 2b, '3', '4']
  # S2_0 (ledger key 2null) is left out of every plot and table; the ledger keeps its rows.
  exclude: [2null]
  colors: {}  # Optional strategy identifier -> Matplotlib colour
plot:
  figsize: [12, 6]
  dpi: 150
  show: false
# Which confidence interval the mean-of-reruns plots draw. Tables always hold both.
#   t         - 95% t interval of reruns
#   resampled - 95% percentile bootstrap of reruns
# Speedup plots always draw the paired Fieller interval and compare always uses paired log-t,
# so they ignore this setting. Per-rerun throughput plots keep the ledger's 99.9% bounds.
ci:
  method: t
# Every rerun is included. Throughput uses the mean of reruns; speedup uses the ratio of mean scores.
# 2A vs 2B equivalence margin, as a fraction: 0.05 means the two count as the same when the
# interval for 2A/2B lies inside 1/1.05 to 1.05. It was fixed on 2026-11-01, while the final
# runs were still running and before anyone had seen 2A vs 2B results.
# Why 5%:
# - Cost: 2A and 2B write byte-identical objects (thesis section 3.10.2), so S3 and cross-AZ
#   costs match. A gap costs only compute, and 5% is the most we accept to ignore.
# - Provable: at 2% rerun noise and 0.5 correlation between 2A and 2B, a truly equal pair
#   passes a 5% margin about 100% of the time, but a 2% margin only about 34%. At 3% noise
#   it is 95% against 4% (our own simulation, 10 reruns, not citable). A tighter margin would
#   mostly report noise as "inconclusive".
# - Still strict: a true gap of exactly 5% is wrongly called equivalent at most about 1% of
#   the time, in each row.
# - Open: no published standard sets this number, so it is a stated project decision. The
#   table also gives the smallest provable margin per row, so readers can apply a tighter one.
comparison:
  margin: 0.05
